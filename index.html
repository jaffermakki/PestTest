*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

.mb3{margin-bottom:.9rem;}

.g{display:grid;gap:1.1rem;}

<script>
// ===================== UTILITIES =====================
const Utils = {
  toast(msg, type='success') {
    const c = document.getElementById('tc2');
    const t = document.createElement('div'); t.className = 'toast';
    const icon = type === 'success' ? 'check-circle' : (type === 'danger' ? 'alert-circle' : 'info');
    t.innerHTML = `<i data-lucide="${icon}"></i> ${msg}`;
    c.appendChild(t); if(window.lucide) lucide.createIcons();
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
  },
  currency(n) { return '₹' + parseFloat(n||0).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,'); },
  daysUntil(ds) { if(!ds) return null; return Math.ceil((new Date(ds) - new Date()) / 86400000); },
  badge(text, type) { return `<span class="badge ${type}">${text}</span>`; },
  table(data, cols, actions, emptyMsg = 'No records found.') {
    if(!data || !data.length) return `<div style="padding:2rem;text-align:center;color:var(--muted);"><i data-lucide="inbox" style="width:36px;opacity:.3;"></i><p>${emptyMsg}</p></div>`;
    let h = `<div class="tc"><table><thead><tr>`;
    cols.forEach(c => h += `<th>${c.label}</th>`);
    if(actions) h += `<th>Actions</th>`;
    h += `</tr></thead><tbody>`;
    data.forEach(row => {
      h += `<tr>`;
      cols.forEach(c => {
        let val = row[c.key] || '—';
        if(c.format) val = c.format(val, row);
        h += `<td>${val}</td>`;
      });
      if(actions) h += `<td><div style="display:flex;gap:4px;flex-wrap:wrap;">${actions(row)}</div></td>`;
      h += `</tr>`;
    });
    h += `</tbody></tr></div>`;
    return h;
  },
  numberToWords(num) {
    const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
    const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    if ((num = num.toString()).length > 9) return 'overflow';
    let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
    if (!n) return ''; let s = '';
    s += (n[1] != 0) ? (a[+n[1]] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
    s += (n[2] != 0) ? (a[+n[2]] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
    s += (n[3] != 0) ? (a[+n[3]] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
    s += (n[4] != 0) ? (a[+n[4]] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
    s += (n[5] != 0) ? ((s != '') ? 'and ' : '') + (a[+n[5]] || b[n[5][0]] + ' ' + a[n[5][1]]) + 'Only' : 'Only';
    return s;
  }
};

// ===================== JSONBIN CLOUD =====================
const JSONBIN_API_KEY = "$2a$10$faeguGZ2l6OKA1V5eBf7o.hswiOtlSPOtmrRvg6q9nNg0DgmsVtOe";
const JSONBIN_BIN_ID   = "6a266d5cf5f4af5e29c9b05e";

let lastSyncSuccess = true;

async function saveToCloud(db) {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY },
      body: JSON.stringify(db)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastSyncSuccess = true;
    return true;
  } catch (err) {
    console.error("Save to cloud failed", err);
    lastSyncSuccess = false;
    Utils.toast("Cloud save failed! Check console.", "danger");
    return false;
  }
}

async function loadFromCloud() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { "X-Master-Key": JSONBIN_API_KEY }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.record;
  } catch (err) {
    console.error("Load from cloud failed", err);
    return null;
  }
}

// ===================== APP =====================
class App {
  constructor() {
    this.me = null;
    this.charts = {};
    this.currentView = 'dashboard';
    this.init();
  }
  async init() {
    this.store = new Store();
    await this.store.initPromise;
    this.initEventListeners();
    this.autoLogin();
  }
  initEventListeners() {
    document.getElementById('loginBtn').addEventListener('click', () => this.login());
    document.getElementById('logoutBtn').addEventListener('click', () => this.logout());
    document.getElementById('toggleSidebarBtn').addEventListener('click', () => this.toggleSidebar());
    document.getElementById('themeToggleBtn').addEventListener('click', () => this.toggleTheme());
    document.getElementById('nm').addEventListener('click', (e) => {
      const item = e.target.closest('.ni');
      if(item && item.dataset.view) this.loadView(item.dataset.view);
    });
  }
  async autoLogin() {
    try {
      const raw = sessionStorage.getItem('pct_s') || localStorage.getItem('pct_r');
      if(raw) {
        const sess = JSON.parse(raw);
        const user = this.store.get('users').find(u => u.id === sess.id && u.username === sess.username);
        if(user) { this.doLogin(user, !!localStorage.getItem('pct_r')); return true; }
      }
    } catch(e) {}
    document.getElementById('lv').style.display = 'flex';
    lucide.createIcons();
    return false;
  }
  async login() {
    const username = document.getElementById('lu').value.trim();
    const password = document.getElementById('lp').value;
    const remember = document.getElementById('rm').checked;
    const user = this.store.get('users').find(u => u.username === username && u.pass === password);
    if(user) this.doLogin(user, remember);
    else Utils.toast('Invalid credentials', 'danger');
  }
  async doLogin(user, remember) {
    this.me = user;
    sessionStorage.setItem('pct_s', JSON.stringify({ id: user.id, username: user.username }));
    if(remember) localStorage.setItem('pct_r', sessionStorage.getItem('pct_s'));
    else localStorage.removeItem('pct_r');
    document.getElementById('lv').style.display = 'none';
    document.getElementById('app-container').classList.remove('hidden');
    document.getElementById('ui').innerText = `${user.username} · ${user.role}`;
    this.buildMenu();
    this.loadView('dashboard');
    this.updateFollowupBell();
    if(this.store.db.settings.theme === 'dark') document.body.classList.add('dark');
  }
  logout() {
    this.me = null;
    sessionStorage.removeItem('pct_s');
    localStorage.removeItem('pct_r');
    document.getElementById('lv').style.display = 'flex';
    document.getElementById('app-container').classList.add('hidden');
    document.getElementById('lf').reset();
    Object.values(this.charts).forEach(c => c && c.destroy());
    this.charts = {};
  }
  refreshCurrentView() { if(this.currentView) this.loadView(this.currentView); }
  toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
  toggleTheme() {
    document.body.classList.toggle('dark');
    this.store.db.settings.theme = document.body.classList.contains('dark') ? 'dark' : 'light';
    this.store.save();
    if(this.currentView === 'dashboard') this.renderDashboard();

  buildMenu() {
    const views = {
      dashboard: { title:'Dashboard', icon:'layout-dashboard', roles:['admin','manager','technician'] },
      customers: { title:'Customers', icon:'users', roles:['admin','manager','technician'] },
      followups: { title:'Follow-Ups', icon:'phone-call', roles:['admin','manager'] },
      jobs: { title:'Jobs & Scheduling', icon:'calendar-days', roles:['admin','manager','technician'] },
      invoices: { title:'Invoices & Billing', icon:'file-text', roles:['admin','manager'] },
      amc: { title:'AMC Contracts', icon:'refresh-cw', roles:['admin','manager'] },
      inventory: { title:'Inventory & Chemicals', icon:'package', roles:['admin','manager'] },
      reports: { title:'Reports', icon:'bar-chart-3', roles:['admin','manager'] },
      settings: { title:'Settings & Users', icon:'settings', roles:['admin'] }
    };
    const container = document.getElementById('nm');
    container.innerHTML = '';
    let lastSection = '';
    for(const [key,val] of Object.entries(views)) {
      if(!val.roles.includes(this.me.role)) continue;
      const section = (key === 'reports' || key === 'settings') ? 'Reports' : 'Main';
      if(section !== lastSection) { lastSection = section; container.innerHTML += `<div class="nsec">${section}</div>`; }
      const div = document.createElement('div'); div.className = 'ni'; div.dataset.view = key;
      div.innerHTML = `<i data-lucide="${val.icon}" style="width:15px;"></i><span>${val.title}</span>`;
      div.onclick = () => this.loadView(key);
      container.appendChild(div);
    }
    lucide.createIcons();
  }
  loadView(view) {
    if(!this.me) return;
    const methodName = 'render' + view.charAt(0).toUpperCase() + view.slice(1);
    if(typeof this[methodName] !== 'function') view = 'dashboard';
    this.currentView = view;
    document.getElementById('vt').innerText = view.charAt(0).toUpperCase() + view.slice(1);
    document.querySelectorAll('.ni').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    document.getElementById('ca').innerHTML = '';
    Object.values(this.charts).forEach(c => c && c.destroy());
    this.charts = {};
    this[methodName]();
    lucide.createIcons();
    this.updateFollowupBell();
  }
  openModal(title, html) {
    document.getElementById('mt').innerText = title;
    document.getElementById('mb').innerHTML = html;

  }
  closeModal() { document.getElementById('mo').style.display = 'none'; }
  updateFollowupBell() {
    const today = new Date(); today.setHours(0,0,0,0);

      if(!c.followupDate) return false;
      const d = new Date(c.followupDate); d.setHours(0,0,0,0);

    }).length;
    document.getElementById('fc').innerText = due > 0 ? `${due} due today` : 'Follow-ups';

    if(document.getElementById('invSub')) document.getElementById('invSub').value = sub.toFixed(2);
    if(document.getElementById('invGst')) document.getElementById('invGst').value = gst.toFixed(2);
    if(document.getElementById('invTotal')) document.getElementById('invTotal').value = tot.toFixed(2);

  // ----- INVENTORY -----
  renderInventory() {
    const items = this.store.get('inventory');
    const cols = [{ key:'name', label:'Item' }, { key:'qty', label:'Stock' }, { key:'unit', label:'Unit' }];
    const actions = (row) => `<button class="success sm" onclick="window.app.adjustStock('${row.id}',1)">+</button><button class="warn sm" onclick="window.app.adjustStock('${row.id}',-1)">−</button><button class="sec sm" onclick="window.app.showInventoryForm('${row.id}')">✏️</button><button class="danger sm" onclick="window.app.deleteInventoryItem('${row.id}')">🗑️</button>`;
    document.getElementById('ca').innerHTML = `<div class="fb mb3"><button onclick="window.app.showInventoryForm()">+ Add Item</button></div><div class="card" style="padding:0;" id="inventoryTable">${Utils.table(items, cols, actions, 'No inventory items.')}</div>`;
  }
  showInventoryForm(id) {
    const it = id ? this.store.byId('inventory', id) : {};
    this.openModal(id ? 'Edit Item' : 'Add Item', `<form onsubmit="window.app.saveInventoryItem(event, '${id||''}')"><input name="name" required placeholder="Item name" value="${it.name||''}"><input type="number" name="qty" min="0" required value="${it.qty||0}"><select name="unit">${['Litres','ml','kg','g','Pieces','Bottles'].map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join('')}</select><button type="submit">Save</button></form>`);
  }
  async saveInventoryItem(e, id) { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); if(id) await this.store.update('inventory', id, data); else await this.store.add('inventory', data); this.closeModal(); this.renderInventory(); Utils.toast('Saved'); }
  async adjustStock(id, delta) { const it = this.store.byId('inventory', id); const newQty = Math.max(0, Number(it.qty) + delta); await this.store.update('inventory', id, { qty: newQty }); this.renderInventory(); }
  async deleteInventoryItem(id) { if(confirm('Delete?')) { await this.store.delete('inventory', id); this.renderInventory(); } }
  // ----- REPORTS -----
  renderReports() { document.getElementById('ca').innerHTML = `<div class="card"><h3>Reports</h3><button onclick="window.app.exportCSV('customers')">Export Customers CSV</button><button onclick="window.app.exportCSV('invoices')">Export Invoices CSV</button></div>`; }
  exportCSV(table) {
    const data = this.store.get(table);
    if(!data.length) { Utils.toast('No data','danger'); return; }
    const keys = Object.keys(data[0]).filter(k => typeof data[0][k] !== 'object');
    let csv = keys.join(',') + '\n';
    data.forEach(row => { csv += keys.map(k => `"${(row[k]||'').toString().replace(/"/g,'""')}"`).join(',') + '\n'; });
    const blob = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pct_${table}_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href); Utils.toast('Exported');
  }
  // ----- SETTINGS (with fixed logo uploads) -----
  renderSettings() {
    const s = this.store.db.settings;
    const users = this.store.get('users');
    const logs = this.store.get('logs');
    document.getElementById('ca').innerHTML = `
      <div class="g g2 mb4">
        <div class="card"><h4>Company Details</h4><form onsubmit="window.app.saveCompanySettings(event)"><input name="companyName" value="${s.companyName||''}"><input name="companyTagline" value="${s.companyTagline||''}"><textarea name="companyAddress">${s.companyAddress||''}</textarea><div class="fr"><input name="companyPhone" value="${s.companyPhone||''}"><input name="companyGST" value="${s.companyGST||''}"></div><button type="submit">Save</button></form></div>
        <div class="card"><h4>Logos & Backup</h4>
          <label>Company Logo</label><input type="file" accept="image/*" onchange="window.app.uploadLogo(event, 'companyLogo')">
          ${s.companyLogo ? `<img src="${s.companyLogo}" style="max-height:60px; margin-top:5px; border:1px solid var(--border); border-radius:4px;">` : '<p class="muted" style="font-size:0.75rem;">No logo uploaded</p>'}
          <label style="margin-top:12px;">Member Logo (IPCA / Association)</label><input type="file" accept="image/*" onchange="window.app.uploadLogo(event, 'memberLogo')">
          ${s.memberLogo ? `<img src="${s.memberLogo}" style="max-height:60px; margin-top:5px; border:1px solid var(--border); border-radius:4px;">` : '<p class="muted" style="font-size:0.75rem;">No logo uploaded</p>'}
          <div style="margin-top:15px;"><button class="sec" onclick="window.app.backupData()">📥 Download Backup</button><button class="sec" style="margin-left:8px;" onclick="document.getElementById('restoreFile').click()">📤 Restore Backup</button><input type="file" id="restoreFile" style="display:none" accept=".json" onchange="window.app.restoreData(event)"></div>
        </div>
      </div>
      <div class="card mb4"><h4>Users</h4>${Utils.table(users, [{key:'username',label:'Username'},{key:'role',label:'Role'}], row => this.me.id !== row.id ? `<button class="danger sm" onclick="window.app.deleteUser('${row.id}')">Delete</button>` : '<span>You</span>')}<button class="sec" onclick="window.app.showAddUserForm()">+ Add User</button></div>
      <div class="card"><h4>Audit Log</h4><div style="max-height:300px;overflow-y:auto;">${Utils.table(logs.slice(0,100), [{key:'time',label:'Time'},{key:'user',label:'User'},{key:'action',label:'Action'}], null)}</div></div>
    `;
  }

  async uploadLogo(e, key) {
    const file = e.target.files[0];
    if (!file) return;
    Utils.toast(`Compressing ${key === 'companyLogo' ? 'company' : 'member'} logo...`, "info");
    try {
      const compressedBase64 = await this.compressImage(file, 0.7, 800);
      if (!compressedBase64) throw new Error("Compression failed");
      this.store.db.settings[key] = compressedBase64;
      await this.store.save();
      this.renderSettings();
      Utils.toast(`${key === 'companyLogo' ? 'Company' : 'Member'} logo saved permanently!`);
    } catch (err) {
      console.error("Logo upload error:", err);
      Utils.toast(`Failed to save ${key}. Error: ${err.message}`, "danger");
    }
  }

  compressImage(file, quality = 0.7, maxWidth = 800) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = (height * maxWidth) / width;
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          let outputType = file.type;
          if (outputType !== 'image/jpeg' && outputType !== 'image/png' && outputType !== 'image/webp') {
            outputType = 'image/jpeg';
          }
          const base64 = canvas.toDataURL(outputType, quality);
          resolve(base64);
        };
        img.onerror = (err) => reject(new Error("Image load failed"));
        img.src = ev.target.result;
      };
      reader.onerror = (err) => reject(new Error("File read failed"));
      reader.readAsDataURL(file);
    });
  }

  async saveCompanySettings(e) { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); Object.assign(this.store.db.settings, data); await this.store.save(); this.renderSettings(); Utils.toast('Settings saved'); }
  backupData() { const data = JSON.stringify(this.store.db); const blob = new Blob([data], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pct_backup_${new Date().toISOString().slice(0,10)}.json`; a.click(); }
  restoreData(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = async ev => { try { const imported = JSON.parse(ev.target.result); if(imported.users && imported.customers) { this.store.db = imported; await this.store.save(); Utils.toast('Restored, reloading...'); setTimeout(()=>location.reload(), 1500); } else throw new Error(); } catch(err) { Utils.toast('Invalid backup','danger'); } }; reader.readAsText(file); }
  showAddUserForm() { this.openModal('Add User', `<form onsubmit="window.app.saveNewUser(event)"><input name="username" required><input type="password" name="pass" required><select name="role"><option>technician</option><option>manager</option><option>admin</option></select><button type="submit">Add</button></form>`); }
  async saveNewUser(e) { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); if(this.store.get('users').find(u=>u.username===data.username)) { Utils.toast('Username exists','danger'); return; } await this.store.add('users', data); this.closeModal(); this.renderSettings(); Utils.toast('User added'); }
  async deleteUser(id) { if(confirm('Delete user?')) { await this.store.delete('users', id); this.renderSettings(); } }
}

document.addEventListener('DOMContentLoaded', () => {
  window.app = new App();
});
</script>
</body>
